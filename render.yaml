# Render Blueprint for the Dream Auto Builders store.
#
# Creates: the shop (a Python web service with a 10 GB disk for product photos and uploaded SEMA
# files) and its Postgres database. In Render: New > Blueprint > pick this repository > Apply.
# Render asks for ADMIN_PASSWORD and SITE_PASSWORD while creating it (see docs/DEPLOY.md).
#
# Approximate monthly cost: web Standard $25 + Postgres Basic-256mb $6 + database storage 5 GB $1.50
# + disk 10 GB $2.50 = about $35. The web service needs Standard (2 GB memory) because catalog
# imports run on it: the largest catalog file so far (MagnaFlow) uses about 400 MB while loading, and
# photo downloads up to about 700 MB (Mickey Thompson sends 4000 px photos).

databases:
  - name: dab-db
    databaseName: dab
    user: dab
    plan: basic-256mb
    diskSizeGB: 5
    postgresMajorVersion: "16"
    region: ohio
    ipAllowList: []          # only the shop can connect (private network)

services:
  - type: web
    name: dream-auto-builders
    runtime: python
    region: ohio
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --factory store.app:create_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD        # for /admin (catalog uploads). Pick a strong one.
        sync: false
      - key: SITE_PASSWORD         # visitors need it while the site is a private test site
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: SITE_PREVIEW
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: PHOTO_DIR
        value: /var/data/photos
      # Checkout and order emails. Render only asks for these when a Blueprint is first created, so on the
      # existing service add them on its Environment page (see docs/DEPLOY.md).
      - key: STRIPE_SECRET_KEY       # sk_test_... until launch
        sync: false
      - key: STRIPE_WEBHOOK_SECRET   # whsec_... from the webhook endpoint in Stripe
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM               # e.g. Dream Auto Builders <orders@yourdomain.com>
        sync: false
      - key: ORDER_NOTIFY_EMAIL      # where new-order alerts go
        sync: false
      - key: TURN14_CLIENT_ID        # Turn 14 API keys (turn14.com > Settings & Data > API Settings)
        sync: false
      - key: TURN14_CLIENT_SECRET
        sync: false
      - key: TURN14_ENV              # test until Turn 14 grants production access
        value: test
      - key: TURN14_AUTO             # 1 = run the Turn 14 sync on schedule (after the first full load)
        value: "0"
      - key: SEMA_USERNAME           # SEMA Data website login, used by the SEMA Data API connection
        sync: false
      - key: SEMA_PASSWORD
        sync: false
      - key: SEMA_AUTO               # 1 = load updated SEMA brands nightly (after the first load)
        value: "0"
      - key: PHOTO_WORKERS
        value: "4"
