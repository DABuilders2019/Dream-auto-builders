<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f9"/>
      <stop offset=".22" stop-color="#c8cbd1"/>
      <stop offset=".48" stop-color="#7d828b"/>
      <stop offset=".52" stop-color="#5d626b"/>
      <stop offset=".75" stop-color="#b4b8bf"/>
      <stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <radialGradient id="chromeR" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c3c7ce"/>
      <stop offset=".7" stop-color="#6c717a"/>
      <stop offset="1" stop-color="#3f434a"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b70"/>
      <stop offset=".3" stop-color="#d31b23"/>
      <stop offset=".7" stop-color="#8e0c12"/>
      <stop offset="1" stop-color="#c2242b"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset=".5" stop-color="#151518"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </linearGradient>
    <mask id="jaw">
      <rect x="-100" y="-100" width="800" height="300" fill="#fff"/>
      <rect x="505" y="-15" width="80" height="30" fill="#000"/>
      <circle cx="40" cy="0" r="20" fill="#000"/>
    </mask>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3c0a0d" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- screwdriver (red handle), behind -->
    <g transform="translate(540 80) rotate(135)">
      <rect x="0" y="-32" width="200" height="64" rx="28" fill="url(#handle)"/>
      <g fill="#000" opacity=".18">
        <rect x="34" y="-26" width="9" height="52" rx="4.5"/><rect x="66" y="-26" width="9" height="52" rx="4.5"/>
        <rect x="98" y="-26" width="9" height="52" rx="4.5"/><rect x="130" y="-26" width="9" height="52" rx="4.5"/>
      </g>
      <rect x="12" y="-24" width="176" height="8" rx="4" fill="#fff" opacity=".28"/>
      <rect x="190" y="-22" width="30" height="44" rx="9" fill="url(#black)"/>
      <rect x="216" y="-10" width="270" height="20" rx="5" fill="url(#chrome)"/>
      <path d="M484 -10 L526 -4 L530 0 L526 4 L484 10 Z" fill="url(#chrome)"/>
    </g>
    <!-- combination wrench, in front -->
    <g transform="translate(70 70) rotate(45)">
      <g mask="url(#jaw)">
        <circle cx="40" cy="0" r="42" fill="url(#chromeR)"/>
        <path d="M70 -18 L470 -16 Q478 -16 484 -23 L492 -31 L520 -31 Q550 -20 554 0 Q550 20 520 31 L492 31 L484 23 Q478 16 470 16 L70 18 Z" fill="url(#chrome)"/>
        <circle cx="512" cy="0" r="46" fill="url(#chromeR)"/>
      </g>
      <circle cx="40" cy="0" r="20" fill="none" stroke="#2c2f35" stroke-width="3" opacity=".6"/>
      <rect x="130" y="-7" width="290" height="14" rx="7" fill="#3a3e45" opacity=".35"/>
      <rect x="130" y="-14" width="290" height="4" rx="2" fill="#fff" opacity=".6"/>
    </g>
  </g>
</svg>
