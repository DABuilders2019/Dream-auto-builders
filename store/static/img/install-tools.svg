<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e9e9ec"/>
      <stop offset=".55" stop-color="#c9c9cf"/>
      <stop offset="1" stop-color="#f4f4f6"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d9d9de" stop-opacity=".95"/>
    </linearGradient>
    <mask id="jaw">
      <rect x="-100" y="-100" width="800" height="300" fill="#fff"/>
      <rect x="505" y="-15" width="80" height="30" fill="#000"/>
      <circle cx="40" cy="0" r="19" fill="#000"/>
    </mask>
  </defs>
  <!-- combination wrench, corner to corner -->
  <g transform="translate(70 70) rotate(45) translate(0 0)">
    <g mask="url(#jaw)" fill="url(#steel)">
      <circle cx="40" cy="0" r="40"/>
      <path d="M68 -17 L470 -15 Q478 -15 484 -22 L492 -30 L520 -30 Q548 -20 552 0 Q548 20 520 30 L492 30 L484 22 Q478 15 470 15 L68 17 Z"/>
      <circle cx="510" cy="0" r="44"/>
    </g>
    <rect x="120" y="-6" width="300" height="12" rx="6" fill="#000" opacity=".08"/>
  </g>
  <!-- screwdriver, crossing the other way -->
  <g transform="translate(530 70) rotate(135)">
    <rect x="0" y="-30" width="190" height="60" rx="26" fill="url(#grip)"/>
    <g fill="#000" opacity=".1">
      <rect x="30" y="-24" width="10" height="48" rx="5"/><rect x="62" y="-24" width="10" height="48" rx="5"/>
      <rect x="94" y="-24" width="10" height="48" rx="5"/><rect x="126" y="-24" width="10" height="48" rx="5"/>
    </g>
    <rect x="182" y="-20" width="26" height="40" rx="8" fill="url(#steel)"/>
    <rect x="204" y="-9" width="270" height="18" rx="4" fill="url(#steel)"/>
    <path d="M472 -9 L512 -4 L516 0 L512 4 L472 9 Z" fill="url(#steel)"/>
  </g>
</svg>
