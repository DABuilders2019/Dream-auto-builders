  <section class="bbanner{{ ' nopic' if not banner.image }}">
    <div class="bb-text">
      {% if banner.logo %}<div class="bb-logo"><img src="{{ banner.logo }}" alt="{{ banner.name }} logo"></div>{% endif %}
      <h1 class="bb-name">{{ banner.name if not title else title }}</h1>
      <p class="bb-blurb">{{ banner.blurb }}</p>
      <div class="bb-meta"><span class="pill"><b class="num">{{ banner.parts|num }}</b> part{{ 's' if banner.parts != 1 }}</span><span>Authorized dealer</span></div>
    </div>
    {% if banner.image %}<div class="bb-pic{{ ' boxed' if banner.boxed }}"><img src="{{ banner.image }}" alt="" loading="eager" decoding="async"></div>{% endif %}
  </section>
