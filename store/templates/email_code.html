<!doctype html>
<html><body style="margin:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#111">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:24px 0"><tr><td align="center">
<table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:10px;overflow:hidden;max-width:520px">
  <tr><td style="background:#A8131A;color:#fff;padding:18px 24px;font-size:20px;font-weight:bold">Dream Auto Builders</td></tr>
  <tr><td style="padding:26px 24px 8px;font-size:16px">{% if name %}Hi {{ name.split(' ')[0] }},{% else %}Hi,{% endif %}<br><br>Your sign-in code is:</td></tr>
  <tr><td style="padding:6px 24px 6px"><div style="font-size:34px;letter-spacing:8px;font-weight:bold;background:#f6f6f6;border-radius:8px;padding:14px 18px;display:inline-block">{{ code }}</div></td></tr>
  <tr><td style="padding:14px 24px 26px;font-size:14px;color:#555">It works for {{ minutes }} minutes. If you didn't ask for it, you can ignore this email; nobody can sign in without the code.</td></tr>
</table></td></tr></table>
</body></html>
