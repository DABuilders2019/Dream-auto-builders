<!doctype html>
<html><body style="margin:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#111113">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 0"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-top:4px solid #a8131a">
  <tr><td style="padding:22px 28px 6px"><b style="font-size:18px">Dream Auto Builders</b></td></tr>
  <tr><td style="padding:10px 28px 4px"><h1 style="font-size:21px;line-height:1.25;margin:6px 0 10px">{{ subject }}</h1></td></tr>
  <tr><td style="padding:0 28px 8px;font-size:15px;line-height:1.55">
    {% for para in body.split('\n\n') %}<p style="margin:0 0 12px">{{ para|e|replace('\n', '<br>'|safe) }}</p>{% endfor %}
  </td></tr>
  {% if button %}<tr><td style="padding:4px 28px 26px">
    <a href="{{ button[1] }}" style="display:inline-block;background:#a8131a;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:13px 22px;border-radius:6px">{{ button[0] }}</a>
  </td></tr>{% endif %}
</table></td></tr></table>
</body></html>
